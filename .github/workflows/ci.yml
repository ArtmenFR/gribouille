name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests serveur
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Build et démarrage Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Configuration (.env et mots de passe)
        run: ./scripts/init.sh
      - name: Construire et lancer la stack
        run: docker compose up -d --build --wait
      - name: Vérifier que le jeu répond (via Traefik)
        run: |
          G='Host: gribouille.localhost'
          curl -fsS -H "$G" http://localhost/ | grep -q Gribouille
          curl -fsSI -H "$G" http://localhost/ | grep -qi content-security-policy
          curl -fsSI -H "$G" http://localhost/app.js | grep -qi "cache-control: no-cache"
          curl -fsS -H "$G" http://localhost/api/health
          curl -fsS -H "$G" http://localhost/api/leaderboard
          curl -fsS -H "$G" -o /dev/null http://localhost/socket.io/socket.io.min.js
          curl -fsS -H "$G" -o /dev/null http://localhost/app.js
          curl -fsS -H "$G" "http://localhost/socket.io/?EIO=4&transport=polling" | grep -q sid
      - name: Vérifier le reste de l'infrastructure
        run: |
          . ./.env
          # Grafana : accessible via le proxy
          curl -fsS -H 'Host: grafana.localhost' http://localhost/api/health
          # Interfaces d'admin : refusées sans mot de passe, ouvertes avec
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: mail.localhost' http://localhost/)" = 401
          curl -fsS -u "$ADMIN_USER:$ADMIN_PASSWORD" -H 'Host: mail.localhost' -o /dev/null http://localhost/
          curl -fsS -u "$ADMIN_USER:$ADMIN_PASSWORD" -H 'Host: prometheus.localhost' http://localhost/-/healthy
          # Réplication Redis active
          docker compose exec -T redis-master redis-cli info replication | grep -q connected_slaves:1
          # Redis injoignable depuis web (réseau interne)
          if docker compose exec -T web sh -c "nc -z -w 2 redis-master 6379"; then
            echo "web ne devrait pas joindre Redis"; exit 1
          fi
          # Un backup a bien été écrit dans le volume
          docker compose exec -T redis-backup sh -c "ls /backups/redis-*.rdb"
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs
      - run: docker compose down -v

  # À chaque push sur main, les images sont publiées sur GitHub Container Registry.
  # Aucun secret à configurer : le GITHUB_TOKEN du dépôt suffit.
  publish:
    name: Publier les images (ghcr.io)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom du propriétaire en minuscules
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image du serveur
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/gribouille-server:latest
            ghcr.io/${{ env.OWNER }}/gribouille-server:${{ github.sha }}
      - name: Image du front
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/gribouille-web:latest
            ghcr.io/${{ env.OWNER }}/gribouille-web:${{ github.sha }}
