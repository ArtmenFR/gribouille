name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests serveur
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Build et démarrage Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construire et lancer la stack
        run: docker compose up -d --build --wait
      - name: Vérifier que le jeu répond
        run: |
          curl -fsS http://localhost:8080/ | grep -q Gribouille
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/api/leaderboard
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
