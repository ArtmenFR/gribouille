# config statique de traefik
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
accessLog: {}

api:
  dashboard: true      # accessible via dynamic.yml, avec mot de passe

ping:
  entryPoint: ping     # pour le healthcheck

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true

entryPoints:
  web:
    address: ":8000"   # publie sur le port 80 de la vm
  metrics:
    address: ":8082"   # pour prometheus, pas publie
  ping:
    address: ":8083"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
