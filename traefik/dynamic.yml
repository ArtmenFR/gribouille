# un sous-domaine par service
# regex sur le debut du nom, comme ca marche avec .localhost ou .<ip>.nip.io
http:
  routers:
    gribouille:
      rule: 'HostRegexp(`^gribouille\..+$`)'
      entryPoints: [web]
      service: gribouille

    grafana:
      rule: 'HostRegexp(`^grafana\..+$`)'
      entryPoints: [web]
      service: grafana   # grafana a deja son login

    prometheus:
      rule: 'HostRegexp(`^prometheus\..+$`)'
      entryPoints: [web]
      middlewares: [admin-auth]
      service: prometheus

    alertmanager:
      rule: 'HostRegexp(`^alertmanager\..+$`)'
      entryPoints: [web]
      middlewares: [admin-auth]
      service: alertmanager

    mail:
      rule: 'HostRegexp(`^mail\..+$`)'
      entryPoints: [web]
      middlewares: [admin-auth]
      service: mailpit

    traefik:
      rule: 'HostRegexp(`^traefik\..+$`)'
      entryPoints: [web]
      middlewares: [admin-auth]
      service: api@internal   # dashboard sur /dashboard/

  middlewares:
    admin-auth:
      basicAuth:
        usersFile: /etc/traefik/users.htpasswd   # cree par init.sh, pas dans git
        removeHeader: true

  services:
    gribouille:
      loadBalancer:
        servers: [{ url: "http://web:80" }]
    grafana:
      loadBalancer:
        servers: [{ url: "http://grafana:3000" }]
    prometheus:
      loadBalancer:
        servers: [{ url: "http://prometheus:9090" }]
    alertmanager:
      loadBalancer:
        servers: [{ url: "http://alertmanager:9093" }]
    mailpit:
      loadBalancer:
        servers: [{ url: "http://mailpit:8025" }]
