# Gribouille - toute la stack
# lancement : make up  (ou ./scripts/init.sh puis docker compose up -d --build --wait)
# seul Traefik publie un port, chaque service a son sous-domaine :
#   gribouille.localhost, grafana.localhost, prometheus.localhost,
#   alertmanager.localhost, mail.localhost, traefik.localhost

name: gribouille

# options communes a tous les services
x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # --- reverse proxy ---
  # config en fichiers, pas de socket docker monte
  traefik:
    <<: *common
    image: traefik:v3.6
    user: "65534:65534"
    ports:
      - "${HTTP_PORT:-80}:8000"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/users.htpasswd:/etc/traefik/users.htpasswd:ro
    networks: [proxy]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # --- application ---
  # serveur web : fichiers du jeu + relais websocket vers server
  web:
    <<: *common
    build: ./web
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    networks: [proxy, app]
    mem_limit: 128m

  # serveur de jeu (node + socket.io)
  server:
    <<: *common
    build: ./server
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?lance ./scripts/init.sh (ou copie .env.example en .env)}@redis-master:6379
    depends_on:
      redis-master:
        condition: service_healthy
    networks: [app, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 1.0

  # --- base de donnees ---
  redis-master:
    <<: *common
    image: redis:7-alpine
    user: redis
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?lance ./scripts/init.sh (ou copie .env.example en .env)}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-replica:
    <<: *common
    image: redis:7-alpine
    user: redis
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --replicaof
      - redis-master
      - "6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-replica-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:
      # ok si redis repond et que le lien avec le master est up
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli info replication | grep -q master_link_status:up"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # sauvegarde : dump du replica toutes les 5 min, on garde les 12 derniers
  redis-backup:
    <<: *common
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "backup toutes les $${BACKUP_INTERVAL}s, $${BACKUP_KEEP} copies conservées"
        while true; do
          f="/backups/redis-$$(date +%Y%m%d-%H%M%S).rdb"
          if redis-cli -h redis-replica --rdb "$$f" >/dev/null; then
            echo "backup ok : $$f"
          else
            echo "backup ECHEC" >&2; rm -f "$$f"
          fi
          ls -1t /backups/redis-*.rdb | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f --
          sleep "$$BACKUP_INTERVAL"
        done
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-300}
      BACKUP_KEEP: ${BACKUP_KEEP:-12}
    volumes:
      - backups:/backups
    depends_on:
      redis-replica:
        condition: service_healthy
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    healthcheck:
      # ok s'il y a un backup recent
      test: ["CMD-SHELL", "test -n \"$$(find /backups -name 'redis-*.rdb' -mmin -$$((BACKUP_INTERVAL / 60 * 2 + 2)))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # --- mail ---
  # serveur smtp de test, recoit les alertes (interface sur mail.localhost)
  mailpit:
    <<: *common
    image: axllent/mailpit:v1.21.8
    networks: [proxy, monitoring]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # --- monitoring ---
  prometheus:
    <<: *common
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [proxy, monitoring]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3

  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      mailpit:
        condition: service_healthy
    networks: [proxy, monitoring]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3

  grafana:
    <<: *common
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?lance ./scripts/init.sh (ou copie .env.example en .env)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [proxy, monitoring]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  # metriques des conteneurs
  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    security_opt: ["no-new-privileges:true", "label=disable"]  # label=disable pour selinux
    networks: [monitoring]
    mem_limit: 256m

  # metriques de la vm
  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    security_opt: ["no-new-privileges:true", "label=disable"]
    networks: [monitoring]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m

  # metriques redis (un exporter par instance)
  redis-exporter-master:
    <<: *common
    image: oliver006/redis_exporter:v1.66.0-alpine
    environment:
      REDIS_ADDR: redis://redis-master:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data, monitoring]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m

  redis-exporter-replica:
    <<: *common
    image: oliver006/redis_exporter:v1.66.0-alpine
    environment:
      REDIS_ADDR: redis://redis-replica:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data, monitoring]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m

# proxy est le seul reseau qui sort, les autres sont internes
networks:
  proxy:
  app:
    internal: true
  data:
    internal: true
  monitoring:
    internal: true

volumes:
  redis-data:
  redis-replica-data:
  backups:
  prometheus-data:
  alertmanager-data:
  grafana-data:
