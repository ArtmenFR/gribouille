# Gribouille : infrastructure web complète, 100 % conteneurisée (cible : une VM Linux)
#
#   make up                         (génère .env + mots de passe, build, démarre, attend le "healthy")
#   ou : ./scripts/init.sh && docker compose up -d --build --wait
#
# Tout passe par Traefik (seul port publié : HTTP_PORT, 80 par défaut) :
#   gribouille.<domaine>   le jeu          grafana.<domaine>       dashboards
#   prometheus.<domaine>   métriques       alertmanager.<domaine>  alertes
#   mail.<domaine>         boîte mail de test (Mailpit)
#   traefik.<domaine>      dashboard du proxy
# <domaine> = localhost sur la VM, ou <ip-vm>.nip.io depuis ton PC (voir README).

name: gribouille

# Réglages communs : redémarrage auto, pas d'élévation de privilèges, logs bornés
x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ───────────────────────── Reverse proxy ─────────────────────────
  # Config 100 % fichiers (bind mounts) : pas de socket Docker monté, donc pas de risque d'escalade.
  traefik:
    <<: *common
    image: traefik:v3.6
    user: "65534:65534"             # nobody : port interne 8000, aucune capability nécessaire
    ports:
      - "${HTTP_PORT:-80}:8000"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/users.htpasswd:/etc/traefik/users.htpasswd:ro
    networks: [proxy]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ───────────────────────── Application ─────────────────────────
  # Serveur web : fichiers statiques + relais WebSocket vers le serveur de jeu
  web:
    <<: *common
    build: ./web
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # config partagée depuis l'hôte
    depends_on:
      server:
        condition: service_healthy
    networks: [proxy, app]
    mem_limit: 128m

  # Serveur de jeu temps réel (Node.js + Socket.io)
  server:
    <<: *common
    build: ./server
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?lance ./scripts/init.sh (ou copie .env.example en .env)}@redis-master:6379
    depends_on:
      redis-master:
        condition: service_healthy
    networks: [app, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 1.0

  # ───────────────────────── Base de données (master / replica) ─────────────────────────
  redis-master:
    <<: *common
    image: redis:7-alpine
    user: redis
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?lance ./scripts/init.sh (ou copie .env.example en .env)}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}     # redis-cli (healthcheck, exec) s'authentifie tout seul
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-replica:
    <<: *common
    image: redis:7-alpine
    user: redis
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --replicaof
      - redis-master
      - "6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-replica-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:   # sain = répond ET lien de réplication avec le master établi
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli info replication | grep -q master_link_status:up"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Sauvegardes : un dump RDB pris sur le replica (pas de charge sur le master), rotation automatique
  redis-backup:
    <<: *common
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "backup toutes les $${BACKUP_INTERVAL}s, $${BACKUP_KEEP} copies conservées"
        while true; do
          f="/backups/redis-$$(date +%Y%m%d-%H%M%S).rdb"
          if redis-cli -h redis-replica --rdb "$$f" >/dev/null; then
            echo "backup ok : $$f"
          else
            echo "backup ECHEC" >&2; rm -f "$$f"
          fi
          ls -1t /backups/redis-*.rdb | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f --
          sleep "$$BACKUP_INTERVAL"
        done
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-300}
      BACKUP_KEEP: ${BACKUP_KEEP:-12}
    volumes:
      - backups:/backups
    depends_on:
      redis-replica:
        condition: service_healthy
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    healthcheck:   # sain = un backup de moins de 2 intervalles existe
      test: ["CMD-SHELL", "test -n \"$$(find /backups -name 'redis-*.rdb' -mmin -$$((BACKUP_INTERVAL / 60 * 2 + 2)))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ───────────────────────── Mail ─────────────────────────
  # SMTP de test : reçoit les alertes d'Alertmanager, interface web sur mail.<domaine>
  # (en production : remplacer par un vrai relais SMTP)
  mailpit:
    <<: *common
    image: axllent/mailpit:v1.21.8
    networks: [proxy, monitoring]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ───────────────────────── Monitoring ─────────────────────────
  prometheus:
    <<: *common
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [proxy, monitoring]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3

  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      mailpit:
        condition: service_healthy
    networks: [proxy, monitoring]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3

  grafana:
    <<: *common
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?lance ./scripts/init.sh (ou copie .env.example en .env)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [proxy, monitoring]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Métriques par conteneur (CPU, RAM, réseau)
  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    security_opt: ["no-new-privileges:true", "label=disable"]   # label=disable : hôtes SELinux (Fedora, RHEL)
    networks: [monitoring]
    mem_limit: 256m

  # Métriques de la VM (CPU, RAM, disque)
  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    security_opt: ["no-new-privileges:true", "label=disable"]
    networks: [monitoring]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m

  # Un exporter par instance Redis : métriques de base + état de la réplication
  redis-exporter-master:
    <<: *common
    image: oliver006/redis_exporter:v1.66.0-alpine
    environment:
      REDIS_ADDR: redis://redis-master:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data, monitoring]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m

  redis-exporter-replica:
    <<: *common
    image: oliver006/redis_exporter:v1.66.0-alpine
    environment:
      REDIS_ADDR: redis://redis-replica:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data, monitoring]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m

# Réseaux : tout est "internal" (aucune sortie vers Internet) sauf `proxy`, qui porte le port publié.
networks:
  proxy:            # Traefik ↔ services qui ont une interface web
  app:              # web ↔ server
    internal: true
  data:             # server, Redis, backup, exporters : invisible depuis le proxy
    internal: true
  monitoring:       # Prometheus ↔ exporters, Alertmanager ↔ Mailpit
    internal: true

volumes:
  redis-data:           # données du master (AOF + RDB)
  redis-replica-data:   # données du replica
  backups:              # dumps RDB horodatés
  prometheus-data:
  alertmanager-data:
  grafana-data:
