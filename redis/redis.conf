# config commune master/replica (mot de passe et replication passes dans compose.yml)
bind * -::*
dir /data

# persistance : AOF chaque seconde + snapshot RDB toutes les 60 s
appendonly yes
appendfsync everysec
save 60 1

# on ne supprime jamais de donnees si la memoire est pleine
maxmemory 200mb
maxmemory-policy noeviction
