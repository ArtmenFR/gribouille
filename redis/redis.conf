# Configuration commune au master et au replica (le mot de passe et la réplication
# sont passés en arguments par compose.yml : aucun secret dans ce fichier).
bind * -::*
dir /data

# Persistance : AOF (chaque seconde) + instantané RDB si au moins 1 écriture en 60 s
appendonly yes
appendfsync everysec
save 60 1

# Le classement ne doit jamais être évincé : on refuse les écritures plutôt que d'effacer
maxmemory 200mb
maxmemory-policy noeviction
