# utiliser les images publiees par la CI au lieu de build en local :
#   GH_OWNER=ton-pseudo docker compose -f compose.yml -f compose.ghcr.yml up -d --pull always --no-build

services:
  web:
    image: ghcr.io/${GH_OWNER:?indique GH_OWNER=ton-pseudo-github}/gribouille-web:latest
  server:
    image: ghcr.io/${GH_OWNER:?indique GH_OWNER=ton-pseudo-github}/gribouille-server:latest
