global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: traefik          # requêtes, codes HTTP, latence du reverse proxy
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: cadvisor         # CPU / RAM / réseau de chaque conteneur
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node             # la VM elle-même
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: redis            # le label redis_role distingue master et replica
    static_configs:
      - targets: ["redis-exporter-master:9121"]
        labels: { redis_role: master }
      - targets: ["redis-exporter-replica:9121"]
        labels: { redis_role: replica }
