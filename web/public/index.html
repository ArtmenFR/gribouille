<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gribouille</title>
  <meta name="description" content="Tague, devine, rigole. Un jeu de dessin multijoueur entre potes.">
  <meta name="theme-color" content="#2b2a30">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/permanent-marker-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ACCUEIL -->
  <section id="screen-home" class="screen">
    <header class="brand">
      <div class="logo-wrap">
        <h1 class="logo">Gribouille</h1>
        <svg class="logo-pencil" viewBox="0 0 60 200" aria-hidden="true">
          <g stroke="#141316" stroke-width="4" stroke-linejoin="round">
            <rect x="12" y="8" width="36" height="22" rx="8" fill="#ff9bd2"/>
            <rect x="10" y="28" width="40" height="16" fill="#c9c7cf"/>
            <path d="M10 44 h40 v104 h-40z" fill="#ffd60a"/>
            <path d="M23 44 v104 M37 44 v104" fill="none" stroke-width="2.5"/>
            <path d="M10 148 h40 l-20 44z" fill="#f2c48d"/>
            <path d="M23 177 l7 15 7 -15z" fill="#141316"/>
          </g>
        </svg>
      </div>
      <p class="tagline">Tu dessines comme un pied, tes potes devinent quand même.</p>
    </header>

    <div class="home-grid">
      <div class="poster home-card">
        <label class="name-label" for="name">C'est quoi ton blaze ?</label>
        <input id="name" class="name-input" maxlength="16" autocomplete="nickname" placeholder="Ton pseudo" spellcheck="false">
        <div class="skin" id="home-editor"></div>

        <button class="btn spray-pink big" id="btn-create" type="button">Créer une partie</button>
        <form class="join-row" id="join-form">
          <input id="join-code" class="code-input" maxlength="4" placeholder="CODE" autocapitalize="characters" spellcheck="false" autocomplete="off" aria-label="Code de la partie">
          <button class="btn spray-cyan" id="btn-join" type="submit">Rejoindre</button>
        </form>
        <p class="error" id="home-error" role="alert"></p>
      </div>

      <aside class="sticker sticker-yellow hof-card">
        <h2 class="scribble">Hall of fame</h2>
        <div id="hof" class="hof"></div>
      </aside>
    </div>
  </section>

  <!-- SALON -->
  <section id="screen-lobby" class="screen" hidden>
    <div class="lobby-top">
      <div class="sticker sticker-yellow code-sticker">
        <span class="code-label">Code de la partie</span>
        <div class="code" id="lobby-code"></div>
      </div>
      <div class="lobby-actions">
        <button class="btn spray-cyan" id="btn-copy" type="button">Copier le lien d'invitation</button>
        <button class="btn plain" id="btn-leave" type="button">Quitter</button>
      </div>
    </div>

    <div class="lobby-grid">
      <div class="panel">
        <h2 class="scribble">Le crew <span class="count" id="lobby-count"></span></h2>
        <ul class="lobby-players" id="lobby-players"></ul>
        <form class="rename" id="rename-form">
          <label for="me-name">Ton pseudo</label>
          <div class="rename-row">
            <button type="button" class="avatar me-avatar" id="me-avatar" title="Modifier mon perso" aria-label="Modifier mon perso"></button>
            <input id="me-name" maxlength="16" autocomplete="off" spellcheck="false">
            <button class="btn plain small" type="submit">OK</button>
          </div>
          <button type="button" class="btn spray-yellow small skin-btn" id="btn-skin">Modifier mon perso</button>
        </form>
      </div>

      <div class="panel">
        <h2 class="scribble">Les règles</h2>
        <div class="settings">
          <label class="field"><span>Manches</span><select id="set-rounds"></select></label>
          <label class="field"><span>Temps par dessin</span><select id="set-time"></select></label>
          <label class="field"><span>Joueurs max</span><select id="set-max"></select></label>
          <label class="toggle wide"><input type="checkbox" id="set-hints"><span>Dévoiler des lettres au fil du temps</span></label>
          <label class="field wide"><span>Vos mots à vous <small>séparés par des virgules</small></span>
            <textarea id="set-words" rows="3" placeholder="le prof de réseau, câble RJ45, la cafèt…"></textarea>
          </label>
          <label class="toggle wide"><input type="checkbox" id="set-custom-only"><span>Jouer uniquement avec nos mots</span></label>
        </div>
        <p class="hint-text" id="settings-note"></p>
        <button class="btn spray-pink big" id="btn-start" type="button">Lancer la partie</button>
      </div>

      <div class="panel chat-slot" id="lobby-chat-slot"></div>
    </div>
  </section>

  <!-- JEU -->
  <section id="screen-game" class="screen" hidden>
    <div class="game">
      <div class="topbar panel">
        <div class="round" id="g-round"></div>
        <div class="hint-wrap">
          <div class="hint-label" id="g-hint-label"></div>
          <div class="hint" id="g-hint"></div>
        </div>
        <div class="timer" id="g-timer"></div>
      </div>

      <aside class="players panel">
        <ul id="g-players"></ul>
        <button class="btn plain small wide-btn" id="btn-leave-game" type="button">Quitter</button>
      </aside>

      <main class="stage">
        <div class="canvas-wrap">
          <canvas id="canvas" width="800" height="600"></canvas>
          <div class="overlay" id="overlay" hidden></div>
        </div>
        <div class="under">
          <div class="toolbar panel" id="toolbar" hidden>
            <div class="palette" id="palette"></div>
            <div class="sizes" id="sizes"></div>
            <div class="tools">
              <button type="button" class="tool" data-tool="pen" title="Pinceau (B)" aria-label="Pinceau">✏️</button>
              <button type="button" class="tool" data-tool="fill" title="Pot de peinture (F)" aria-label="Pot de peinture">🪣</button>
              <button type="button" class="tool" data-tool="eraser" title="Gomme (E)" aria-label="Gomme">🧽</button>
              <button type="button" class="tool" id="t-undo" title="Annuler (Ctrl+Z)" aria-label="Annuler">↩️</button>
              <button type="button" class="tool" id="t-clear" title="Tout effacer" aria-label="Tout effacer">🗑️</button>
            </div>
          </div>
          <div class="react panel" id="react" hidden>
            <span>Ce dessin&nbsp;?</span>
            <button type="button" class="react-btn" id="r-up">👍 <span id="r-up-n">0</span></button>
            <button type="button" class="react-btn" id="r-down">👎 <span id="r-down-n">0</span></button>
          </div>
        </div>
      </main>

      <aside class="panel chat-slot" id="game-chat-slot"></aside>
    </div>
  </section>

  <!-- Chat partagé, déplacé entre le salon et le jeu -->
  <div class="chat-panel" id="chat">
    <div class="chat-log" id="chat-log" aria-live="polite"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" maxlength="100" autocomplete="off" placeholder="Écris un message…" aria-label="Message">
    </form>
  </div>
</div>

 <dialog class="skin-dialog" id="skin-dialog" aria-label="Modifier mon perso">
  <h2 class="scribble">Ton perso</h2>
  <div class="skin" id="dialog-editor"></div>
  <div class="dialog-actions">
    <button type="button" class="btn plain" id="skin-cancel">Annuler</button>
    <button type="button" class="btn spray-pink" id="skin-save">Valider</button>
  </div>
</dialog>

<button class="mute" id="btn-mute" type="button" aria-label="Couper le son">🔊</button>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/socket.io/socket.io.min.js"></script>
<script src="avatar.js"></script>
<script src="app.js"></script>
</body>
</html>
