upstream gribouille_server {
    server server:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # "expires" plutôt que "add_header" : un add_header dans un bloc location
    # ferait perdre tous les en-têtes de sécurité définis plus haut (dont la CSP).
    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }

    # Scripts, styles et images : le navigateur garde une copie mais redemande
    # toujours au serveur si elle est à jour (réponse 304 très légère si rien n'a changé).
    # Ainsi, une mise à jour du jeu est visible au premier rechargement.
    location ~* \.(css|js|svg|html)$ {
        expires epoch;
    }

    # Les polices ne changent jamais : elles peuvent rester en cache une semaine.
    location ~* \.woff2$ {
        expires 7d;
    }

    # WebSocket temps réel (Socket.io).
    # "^~" est indispensable : sans lui, la règle des fichiers .js ci-dessus
    # intercepterait /socket.io/socket.io.min.js, qui est fourni par le serveur de jeu.
    location ^~ /socket.io/ {
        proxy_pass http://gribouille_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location ^~ /api/ {
        proxy_pass http://gribouille_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
