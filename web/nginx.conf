upstream gribouille_server {
    server server:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # en-tetes de securite
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # expires et pas add_header, sinon on perd les en-tetes de securite au-dessus
    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }

    # js/css : le navigateur revalide a chaque fois (sinon les maj ne s'affichent pas)
    location ~* \.(css|js|svg|html)$ {
        expires epoch;
    }

    # polices : cache 7 jours
    location ~* \.woff2$ {
        expires 7d;
    }

    # websocket vers le serveur de jeu
    # ^~ obligatoire sinon la regle .js au-dessus prend /socket.io/socket.io.min.js
    location ^~ /socket.io/ {
        proxy_pass http://gribouille_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location ^~ /api/ {
        proxy_pass http://gribouille_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
